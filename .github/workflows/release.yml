name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Get version from dune-project
      id: get_dune_version
      run: echo "dune_version=$(grep -oP '(?<=\(version )\S+(?=\))' dune-project)" >> $GITHUB_OUTPUT
    
    - name: Check version match
      run: |
        if [ "${{ steps.get_version.outputs.version }}" != "${{ steps.get_dune_version.outputs.dune_version }}" ]; then
          echo "Error: Tag version (${{ steps.get_version.outputs.version }}) does not match dune-project version (${{ steps.get_dune_version.outputs.dune_version }})"
          exit 1
        fi
        echo "Version check passed: ${{ steps.get_version.outputs.version }}"

  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            artifact_name: ocalc-macos-arm64
          - os: ubuntu-latest
            arch: x64
            artifact_name: ocalc-linux-x64
          - os: windows-latest
            arch: x64
            artifact_name: ocalc-windows-x64.exe
          - os: windows-latest
            arch: arm64
            artifact_name: ocalc-windows-arm64.exe
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.2.x
    
    - name: Install dependencies
      run: opam install . --deps-only
    
    - name: Build
      run: opam exec -- dune build --profile=release
    
    - name: Rename binary (Unix)
      if: runner.os != 'Windows'
      run: cp _build/default/bin/main.exe ${{ matrix.artifact_name }}
    
    - name: Rename binary (Windows)
      if: runner.os == 'Windows'
      run: copy _build\default\bin\main.exe ${{ matrix.artifact_name }}
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}
  
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
    
    - name: Create GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create $VERSION --verify-tag --title $VERSION artifacts/**/*
